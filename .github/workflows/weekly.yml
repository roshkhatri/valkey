name: Weekly Test Workflow for Released Branches
on:
  schedule:
    - cron: '0 6 * * 0'
  workflow_dispatch: {}
permissions:
  actions: write
  contents: read
  pull-requests: write
concurrency:
  group: weekly-release-tests
  cancel-in-progress: false
jobs:
  # TEST: hardcoded per-branch reusable calls, each pulls that branch's own
  # daily.yml (@<branch>) and checks out that branch's source via use_git_ref.
  # Guards removed so it runs on the fork.
  daily-7-2:
    uses: roshkhatri/valkey/.github/workflows/daily.yml@7.2
    with:
      use_repo: roshkhatri/valkey
      use_git_ref: "7.2"
    secrets: inherit
  daily-8-0:
    uses: roshkhatri/valkey/.github/workflows/daily.yml@8.0
    with:
      use_repo: roshkhatri/valkey
      use_git_ref: "8.0"
    secrets: inherit
  daily-8-1:
    uses: roshkhatri/valkey/.github/workflows/daily.yml@8.1
    with:
      use_repo: roshkhatri/valkey
      use_git_ref: "8.1"
    secrets: inherit
  daily-9-0:
    uses: roshkhatri/valkey/.github/workflows/daily.yml@9.0
    with:
      use_repo: roshkhatri/valkey
      use_git_ref: "9.0"
    secrets: inherit
  daily-9-1:
    uses: roshkhatri/valkey/.github/workflows/daily.yml@9.1
    with:
      use_repo: roshkhatri/valkey
      use_git_ref: "9.1"
    secrets: inherit

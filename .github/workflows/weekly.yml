name: Weekly Test Workflow for Released Branches
on:
  schedule:
    - cron: '0 6 * * 0'
  workflow_dispatch: {}
permissions:
  actions: write
  contents: read
  pull-requests: read
concurrency:
  group: weekly-release-tests
  cancel-in-progress: false
jobs:
  determine-release-branches:
    if: github.repository == 'valkey-io/valkey'
    runs-on: ubuntu-latest
    outputs:
      branches: ${{ steps.release-branches.outputs.branches }}
      has-branches: ${{ steps.release-branches.outputs.has-branches }}
    steps:
      - name: Collect release branches
        id: release-branches
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const MIN_MAJOR = 7;
            const MIN_MINOR = 2;

            const branches = await github.paginate(github.rest.repos.listBranches, {
              owner,
              repo,
              per_page: 100,
            });

            const releaseBranches = branches
              .map(({ name }) => name)
              .filter(name => /^\d+\.\d+$/.test(name))
              .filter(name => {
                const [major, minor] = name.split('.').map(Number);
                return Number.isInteger(major) &&
                  Number.isInteger(minor) &&
                  (major > MIN_MAJOR || (major === MIN_MAJOR && minor >= MIN_MINOR));
              })
              .sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
            core.info(`Weekly release branches: ${releaseBranches.join(', ') || '(none)'}`);
            core.setOutput('branches', JSON.stringify(releaseBranches));
            core.setOutput('has-branches', releaseBranches.length > 0 ? 'true' : 'false');

  dispatch-daily-for-release-branches:
    needs: determine-release-branches
    if: needs.determine-release-branches.outputs.has-branches == 'true' && github.repository == 'valkey-io/valkey'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    permissions:
      actions: write
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        release-branch: ${{ fromJson(needs.determine-release-branches.outputs.branches) }}
    steps:
      - name: Dispatch daily.yml on ${{ matrix.release-branch }} and wait
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const ref = '${{ matrix.release-branch }}';
            const workflow_id = 'daily.yml';
            const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

            // Record time just before dispatch (small buffer for clock skew).
            const dispatchedAfter = new Date(Date.now() - 30_000);

            await github.rest.actions.createWorkflowDispatch({
              owner, repo, workflow_id, ref,
              // 'none' is a sentinel that matches no job/test token, so the
              // dispatched daily runs its full matrix. An empty string does NOT
              // work here: the dispatch API drops empty inputs and the branch's
              // own workflow_dispatch default skip list is applied instead.
              inputs: { skipjobs: 'none', skiptests: 'none' },
            });
            core.info(`Dispatched ${workflow_id} on ${ref}`);

            // 1) Locate the run we just created (it takes a few seconds to appear).
            let run;
            for (let attempt = 0; attempt < 20 && !run; attempt++) {
              await sleep(15_000);
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner, repo, workflow_id,
                branch: ref,
                event: 'workflow_dispatch',
                per_page: 20,
              });
              run = data.workflow_runs
                .filter((r) => new Date(r.created_at) >= dispatchedAfter)
                .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))[0];
              if (!run) core.info(`Run not visible yet (attempt ${attempt + 1})...`);
            }
            if (!run) {
              core.setFailed(`Could not find dispatched daily run for ${ref}`);
              return;
            }
            core.info(`Tracking run ${run.id}: ${run.html_url}`);

            // 2) Poll until the run completes (stay just under the job timeout).
            const POLL_MS = 60_000;
            const DEADLINE = Date.now() + 350 * 60_000;
            let status = run.status;
            let conclusion = run.conclusion;
            while (status !== 'completed') {
              if (Date.now() > DEADLINE) {
                core.setFailed(`Timed out waiting for ${ref} daily run ${run.id}: ${run.html_url}`);
                return;
              }
              await sleep(POLL_MS);
              const { data } = await github.rest.actions.getWorkflowRun({
                owner, repo, run_id: run.id,
              });
              status = data.status;
              conclusion = data.conclusion;
              core.info(`${ref} run ${run.id}: status=${status} conclusion=${conclusion ?? 'pending'}`);
            }

            // 3) Reflect the dispatched run's result in this job.
            if (conclusion !== 'success') {
              core.setFailed(`Daily run for ${ref} concluded '${conclusion}': ${run.html_url}`);
            } else {
              core.info(`Daily run for ${ref} succeeded: ${run.html_url}`);
            }

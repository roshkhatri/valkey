name: Weekly Test Workflow for Released Branches
on:
  schedule:
    - cron: '0 6 * * 0'
  workflow_dispatch: {}
permissions:
  actions: write
  contents: read
  pull-requests: read
concurrency:
  group: weekly-release-tests
  cancel-in-progress: false
jobs:
  determine-release-branches:
    if: github.repository == 'valkey-io/valkey'
    runs-on: ubuntu-latest
    outputs:
      branches: ${{ steps.release-branches.outputs.branches }}
      has-branches: ${{ steps.release-branches.outputs.has-branches }}
    steps:
      - name: Collect release branches
        id: release-branches
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const MIN_MAJOR = 7;
            const MIN_MINOR = 2;

            const branches = await github.paginate(github.rest.repos.listBranches, {
              owner,
              repo,
              per_page: 100,
            });

            const releaseBranches = branches
              .map(({ name }) => name)
              .filter(name => /^\d+\.\d+$/.test(name))
              .filter(name => {
                const [major, minor] = name.split('.').map(Number);
                return Number.isInteger(major) &&
                  Number.isInteger(minor) &&
                  (major > MIN_MAJOR || (major === MIN_MAJOR && minor >= MIN_MINOR));
              })
              .sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
            core.info(`Weekly release branches: ${releaseBranches.join(', ') || '(none)'}`);
            core.setOutput('branches', JSON.stringify(releaseBranches));
            core.setOutput('has-branches', releaseBranches.length > 0 ? 'true' : 'false');

  dispatch-daily-for-release-branches:
    needs: determine-release-branches
    if: needs.determine-release-branches.outputs.has-branches == 'true' && github.repository == 'valkey-io/valkey'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    permissions:
      actions: write
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        release-branch: ${{ fromJson(needs.determine-release-branches.outputs.branches) }}
    steps:
      - name: Dispatch daily.yml on ${{ matrix.release-branch }} and wait
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          REF: ${{ matrix.release-branch }}
        run: |
          set -euo pipefail
          workflow="daily.yml"

          # Timestamp just before dispatch (small buffer for clock skew).
          dispatched_after=$(date -u -d '30 seconds ago' +%s)

          # 'none' is a sentinel that matches no job/test token, so the dispatched
          # daily runs its full matrix. An empty string does NOT work: the dispatch
          # API drops empty inputs and the branch's own workflow_dispatch default
          # skip list is applied instead.
          gh workflow run "$workflow" --repo "$REPO" --ref "$REF" \
            -f skipjobs=none -f skiptests=none
          echo "Dispatched $workflow on $REF"

          # 1) Locate the run we just created (it takes a few seconds to appear).
          run_id=""
          for attempt in $(seq 1 20); do
            sleep 15
            run_id=$(gh run list --repo "$REPO" --workflow "$workflow" \
              --branch "$REF" --event workflow_dispatch \
              --json databaseId,createdAt -L 20 \
              --jq "[.[] | select((.createdAt | fromdateiso8601) >= $dispatched_after)] | sort_by(.createdAt) | last | .databaseId // empty")
            if [ -n "$run_id" ]; then break; fi
            echo "Run not visible yet (attempt $attempt)..."
          done
          if [ -z "$run_id" ]; then
            echo "::error::Could not find dispatched daily run for $REF"
            exit 1
          fi
          echo "Tracking run $run_id: https://github.com/$REPO/actions/runs/$run_id"

          # 2) Poll until the run completes (stay just under the job timeout).
          deadline=$(( $(date -u +%s) + 350 * 60 ))
          while true; do
            info=$(gh run view "$run_id" --repo "$REPO" --json status,conclusion)
            status=$(echo "$info" | jq -r '.status')
            conclusion=$(echo "$info" | jq -r '.conclusion // "pending"')
            echo "$REF run $run_id: status=$status conclusion=$conclusion"
            [ "$status" = "completed" ] && break
            if [ "$(date -u +%s)" -gt "$deadline" ]; then
              echo "::error::Timed out waiting for $REF daily run $run_id: https://github.com/$REPO/actions/runs/$run_id"
              exit 1
            fi
            sleep 120
          done

          # 3) Reflect the dispatched run's result in this job.
          if [ "$conclusion" != "success" ]; then
            echo "::error::Daily run for $REF concluded '$conclusion': https://github.com/$REPO/actions/runs/$run_id"
            exit 1
          fi
          echo "Daily run for $REF succeeded: https://github.com/$REPO/actions/runs/$run_id"
